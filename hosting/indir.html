<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arın'ı İndir</title>
    <!-- Reklam yönlendirme sayfası: arama motorlarında görünmemeli. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#07140f" />
    <meta property="og:title" content="Arın App" />
    <meta
      property="og:description"
      content="Namaz takibi, vakit hatırlatıcıları, zikir matik ve arınma programları."
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f4efe6;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 16% 10%, rgba(74, 222, 128, 0.22), transparent 28rem),
          radial-gradient(circle at 84% 0%, rgba(23, 85, 60, 0.55), transparent 32rem),
          linear-gradient(135deg, #030806 0%, #07140f 45%, #030604 100%);
      }
      .card {
        text-align: center;
        padding: 40px 28px;
        max-width: 420px;
        width: calc(100% - 36px);
      }
      .brand-mark {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        box-shadow: 0 18px 60px rgba(34, 197, 94, 0.35);
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 24px;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 28px;
        color: rgba(244, 239, 230, 0.68);
        font-size: 15px;
        line-height: 1.5;
      }
      .spinner {
        width: 26px;
        height: 26px;
        margin: 0 auto 28px;
        border: 3px solid rgba(74, 222, 128, 0.25);
        border-top-color: #4ade80;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .store-button {
        display: block;
        margin: 0 auto 12px;
        max-width: 280px;
        padding: 15px 22px;
        border-radius: 16px;
        text-decoration: none;
        font-weight: 700;
        font-size: 16px;
        color: #07140f;
        background: linear-gradient(135deg, #4ade80, #22c55e);
      }
      .store-button.secondary {
        color: #f4efe6;
        background: rgba(22, 58, 45, 0.92);
        border: 1px solid rgba(123, 255, 175, 0.18);
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="brand-mark" src="/app-icon.png" alt="Arın uygulama simgesi" width="84" height="84" />
      <h1>Arın</h1>
      <p id="status-text">App Store'a yönlendiriliyorsun…</p>
      <div class="spinner" id="spinner"></div>
      <a class="store-button" id="ios-button" href="#" rel="noopener">App Store'da Aç</a>
      <a class="store-button secondary" id="android-button" href="#" rel="noopener"
        >Google Play'de Aç</a
      >
    </main>

    <script>
      // ── Yapılandırma ─────────────────────────────────────────────────────
      // PIXEL_ID: Meta Events Manager → Veri Kaynakları → web pikseli ID'si.
      // Boş bırakılırsa piksel yüklenmez; yönlendirme yine de çalışır.
      var PIXEL_ID = "1737819667496321";
      // APPLE_PT: App Store Connect → App Analytics → Kampanya bağlantısı
      // oluşturulduğunda verilen "pt" (provider token). Doluysa indirmeler
      // Connect'te "meta_web_ios" kampanyası altında ayrı raporlanır.
      var APPLE_PT = "";
      var APPLE_CT = "meta_web_ios";

      // Kısa kanonik biçim: Instagram/Facebook web-view'larının App Store
      // link yakalayıcısı, kodlanmış Türkçe karakterli uzun adreslerde
      // sessizce başarısız olabiliyor. Apple, id'li kısa adresi kullanıcının
      // bölgesine kendisi yönlendirir.
      var APP_STORE_URL = "https://apps.apple.com/app/id6766336466";
      var PLAY_STORE_URL =
        "https://play.google.com/store/apps/details?id=com.arin.arin";
      var REDIRECT_DELAY_MS = 900;

      // ── Meta Pixel (resmî base kodu; PIXEL_ID boşken atlanır) ────────────
      if (PIXEL_ID) {
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = "2.0";
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
        fbq("init", PIXEL_ID);
        fbq("track", "PageView");
      }

      function track(eventName, params) {
        if (PIXEL_ID && typeof window.fbq === "function") {
          window.fbq("trackCustom", eventName, params || {});
        }
      }

      // Standart event: Meta özel event'leri yalnızca raporlar, reklam
      // optimizasyonu ve atıf tam güçle sadece standart event'lerde çalışır.
      // Reklam setinin dönüşüm hedefi bu ViewContent event'idir.
      function trackStandard(eventName, params) {
        if (PIXEL_ID && typeof window.fbq === "function") {
          window.fbq("track", eventName, params || {});
        }
      }

      // fbevents.js yönlendirme anına dek yüklenmediyse kuyruktaki event
      // navigasyonla kaybolur. Bu durumda event, script gerektirmeyen tekil
      // GET isteğiyle (resmî noscript endpoint'i) yedek olarak gönderilir.
      // Script yüklendiyse (fbq.callMethod tanımlı) event zaten gitmiştir;
      // çift sayım olmaması için yedek atlanır.
      function flushTrackBeforeRedirect(eventName) {
        if (!PIXEL_ID) return;
        var fbqLoaded = window.fbq && typeof window.fbq.callMethod === "function";
        if (fbqLoaded) return;
        var url =
          "https://www.facebook.com/tr?id=" +
          encodeURIComponent(PIXEL_ID) +
          "&ev=" +
          encodeURIComponent(eventName) +
          "&dl=" +
          encodeURIComponent(window.location.href) +
          "&noscript=1";
        // keepalive: istek, tarayıcı App Store'a geçtikten sonra bile
        // tamamlanır. fetch yoksa Image'a düşülür (iptal riskiyle birlikte).
        if (window.fetch) {
          fetch(url, { mode: "no-cors", keepalive: true }).catch(function () {});
        } else {
          new Image().src = url;
        }
      }

      // ── Platform tespiti ve yönlendirme ──────────────────────────────────
      var ua = navigator.userAgent || "";
      var isIos =
        /iPhone|iPad|iPod/i.test(ua) ||
        // iPadOS 13+ kendini Mac gibi tanıtır; dokunmatik ekranla ayrıştırılır.
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      var appStoreUrl = APP_STORE_URL;
      if (APPLE_PT) {
        appStoreUrl +=
          "?pt=" +
          encodeURIComponent(APPLE_PT) +
          "&ct=" +
          encodeURIComponent(APPLE_CT) +
          "&mt=8";
      }
      // Instagram/Facebook uygulama içi tarayıcısı https://apps.apple.com
      // navigasyonlarını (özellikle kullanıcı dokunuşu olmadan) sessizce
      // engelleyebiliyor. itms-appss:// şeması App Store uygulamasını
      // doğrudan tetikler ve web-view'larda da çalışır. Şema başarısız
      // olursa https adresine geri düşülür.
      var appStoreSchemeUrl = appStoreUrl.replace(/^https:/, "itms-appss:");
      var playSchemeUrl = "market://details?id=com.arin.arin";
      // Meta uygulama içi tarayıcıları UA'da kendini belli eder. Instagram
      // iOS web-view'ı (2026 ortasından beri) JS yönlendirmelerini ve App
      // Store'a otomatik geçişleri engelliyor; tek güvenilir kaçış, Instagram
      // uygulamasının kendisinin yakaladığı instagram://extbrowser şemasıyla
      // linki Safari'ye devretmek. Facebook web-view'ı ise x-safari- şemasını
      // onurlandırıyor. Normal Safari/Chrome'da düz https yeterlidir.
      var isInstagram = /Instagram/i.test(ua);
      var isFacebookApp = !isInstagram && /FBAN|FBAV|FB_IAB|FBIOS/i.test(ua);
      var isMetaWebview = isInstagram || isFacebookApp;
      var igEscapeAppStoreUrl =
        "instagram://extbrowser/?url=" + encodeURIComponent(appStoreUrl);
      var igEscapePlayUrl =
        "instagram://extbrowser/?url=" + encodeURIComponent(PLAY_STORE_URL);
      var fbEscapeAppStoreUrl = "x-safari-" + appStoreUrl;
      var fbEscapePlayUrl = "x-safari-" + PLAY_STORE_URL;

      var iosButton = document.getElementById("ios-button");
      var androidButton = document.getElementById("android-button");
      var statusText = document.getElementById("status-text");
      var spinner = document.getElementById("spinner");

      iosButton.href = appStoreUrl;
      androidButton.href = PLAY_STORE_URL;

      // Önce mağaza uygulamasını açan şema denenir; sayfa ~1,5 sn içinde
      // arka plana geçmediyse (document.hidden false kaldıysa) web adresi
      // denenir. Son çare olarak kullanıcıya elle açma ipucu gösterilir.
      function openStore(schemeUrl, webUrl) {
        window.location.href = schemeUrl;
        setTimeout(function () {
          if (!document.hidden) window.location.href = webUrl;
        }, 1500);
        setTimeout(function () {
          if (!document.hidden) {
            spinner.classList.add("hidden");
            statusText.textContent =
              "Otomatik açılmadıysa aşağıdaki butona dokun. Yine olmazsa " +
              "sağ üstteki ⋯ menüsünden 'Harici tarayıcıda aç' seçeneğini kullan.";
          }
        }, 4000);
      }

      // Butonlar bilinçli olarak düz <a> bağlantısıdır (JS araya girmez):
      // kullanıcı dokunuşuyla yapılan native navigasyonu web-view'lar
      // engelleyemez; JS kaynaklı location değişimi ise engellenebiliyor.

      if (isIos) {
        androidButton.classList.add("hidden");
        var iosFirst, iosSecond;
        if (isInstagram) {
          iosFirst = igEscapeAppStoreUrl;
          iosSecond = appStoreUrl;
        } else if (isFacebookApp) {
          iosFirst = fbEscapeAppStoreUrl;
          iosSecond = appStoreUrl;
        } else {
          iosFirst = appStoreUrl;
          iosSecond = appStoreSchemeUrl;
        }
        // Buton düz <a> kalır; dokunuş native navigasyondur ve web-view'ların
        // kaçış şemalarını en güvenilir tetikleyen yol kullanıcı dokunuşudur.
        iosButton.href = iosFirst;
        // Event yönlendirmeden ÖNCE gönderilir; gecikme pikselin isteği
        // tamamlaması için tampon görevi görür.
        track("AppStoreRedirect", { platform: "ios" });
        trackStandard("ViewContent", {
          content_name: "store_redirect",
          content_category: "ios",
        });
        setTimeout(function () {
          flushTrackBeforeRedirect("AppStoreRedirect");
          flushTrackBeforeRedirect("ViewContent");
          openStore(iosFirst, iosSecond);
        }, REDIRECT_DELAY_MS);
      } else if (isAndroid) {
        iosButton.classList.add("hidden");
        var androidFirst, androidSecond;
        if (isInstagram) {
          androidFirst = igEscapePlayUrl;
          androidSecond = PLAY_STORE_URL;
        } else if (isFacebookApp) {
          androidFirst = fbEscapePlayUrl;
          androidSecond = PLAY_STORE_URL;
        } else {
          androidFirst = PLAY_STORE_URL;
          androidSecond = playSchemeUrl;
        }
        androidButton.href = androidFirst;
        statusText.textContent = "Google Play'e yönlendiriliyorsun…";
        track("PlayStoreRedirect", { platform: "android" });
        trackStandard("ViewContent", {
          content_name: "store_redirect",
          content_category: "android",
        });
        setTimeout(function () {
          flushTrackBeforeRedirect("PlayStoreRedirect");
          flushTrackBeforeRedirect("ViewContent");
          openStore(androidFirst, androidSecond);
        }, REDIRECT_DELAY_MS);
      } else {
        spinner.classList.add("hidden");
        statusText.textContent =
          "Arın'ı indirmek için mağazayı seç.";
      }
    </script>
  </body>
</html>
